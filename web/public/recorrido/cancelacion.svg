<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" role="img" aria-label="Un teléfono con un botón de pausa bloqueado y un botón de cancelar">
  <rect width="360" height="240" rx="20" fill="#F6F3EE"/>
  <circle cx="318" cy="206" r="30" fill="#EAE5DB"/><circle cx="42" cy="34" r="24" fill="#EAE5DB"/>
  <rect x="122" y="22" width="116" height="196" rx="20" fill="#14161F"/>
  <rect x="130" y="34" width="100" height="172" rx="12" fill="#fff"/>
  <rect x="158" y="26" width="44" height="5" rx="2.5" fill="#2A2D3D"/>
  <text x="140" y="58" font-family="DM Sans, Arial, sans-serif" font-size="10" font-weight="800" fill="#14161F">Tu suscripción</text>
  <text x="140" y="71" font-family="DM Sans, Arial, sans-serif" font-size="7" font-weight="600" fill="#5E6068">Mensual · $29.900</text>
  <!-- pausar (no disponible) -->
  <rect x="138" y="86" width="84" height="38" rx="10" fill="#F6F3EE" stroke="#E4E0D8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="150" y="98" width="4" height="14" rx="2" fill="#C9C5BC"/><rect x="158" y="98" width="4" height="14" rx="2" fill="#C9C5BC"/>
  <text x="170" y="109" font-family="DM Sans, Arial, sans-serif" font-size="9" font-weight="700" fill="#A8A59E">Pausar</text>
  <text x="170" y="118" font-family="DM Sans, Arial, sans-serif" font-size="6.5" font-weight="600" fill="#A8A59E">No disponible</text>
  <!-- cancelar -->
  <rect x="138" y="134" width="84" height="38" rx="10" fill="#FBE5E0" stroke="#D9341A" stroke-width="1.5"/>
  <text x="180" y="157" text-anchor="middle" font-family="DM Sans, Arial, sans-serif" font-size="10" font-weight="800" fill="#D9341A">Cancelar</text>
  <rect x="146" y="184" width="68" height="10" rx="5" fill="#E4E0D8"/>
  <!-- puerta de salida -->
  <rect x="30" y="86" width="52" height="84" rx="6" fill="#14161F"/><rect x="36" y="92" width="40" height="72" rx="3" fill="#2A2D3D"/>
  <circle cx="68" cy="130" r="3" fill="#FFB81F"/>
  <rect x="34" y="62" width="44" height="16" rx="4" fill="#D9341A"/><text x="56" y="74" text-anchor="middle" font-family="DM Sans, Arial, sans-serif" font-size="8.5" font-weight="800" fill="#fff">SALIDA</text>
  <!-- pausa tachada -->
  <rect x="252" y="90" width="86" height="64" rx="12" fill="#fff" stroke="#E4E0D8" stroke-width="1.5"/>
  <circle cx="295" cy="112" r="14" fill="#F6F3EE" stroke="#D9341A" stroke-width="2"/>
  <rect x="289" y="105" width="4" height="14" rx="2" fill="#D9341A"/><rect x="297" y="105" width="4" height="14" rx="2" fill="#D9341A"/>
  <path d="M283 124l24-24" stroke="#D9341A" stroke-width="3" stroke-linecap="round"/>
  <text x="295" y="137" text-anchor="middle" font-family="DM Sans, Arial, sans-serif" font-size="8" font-weight="700" fill="#14161F">Solo quería</text><text x="295" y="147" text-anchor="middle" font-family="DM Sans, Arial, sans-serif" font-size="8" font-weight="700" fill="#14161F">un descanso</text>
</svg>
