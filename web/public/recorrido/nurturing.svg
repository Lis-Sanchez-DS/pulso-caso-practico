<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" role="img" aria-label="Un teléfono con una clase en video, una racha semanal y una alerta de falla técnica">
  <rect width="360" height="240" rx="20" fill="#F6F3EE"/>
  <circle cx="44" cy="206" r="30" fill="#EAE5DB"/><circle cx="322" cy="34" r="24" fill="#EAE5DB"/>
  <rect x="122" y="22" width="116" height="196" rx="20" fill="#14161F"/>
  <rect x="130" y="34" width="100" height="172" rx="12" fill="#fff"/>
  <rect x="158" y="26" width="44" height="5" rx="2.5" fill="#2A2D3D"/>
  <!-- video -->
  <rect x="138" y="44" width="84" height="64" rx="10" fill="#D9341A"/>
  <circle cx="180" cy="76" r="15" fill="#fff" fill-opacity=".95"/>
  <path d="M175.5 68.5v15l13-7.5z" fill="#D9341A"/>
  <rect x="146" y="98" width="68" height="4" rx="2" fill="#fff" fill-opacity=".35"/><rect x="146" y="98" width="40" height="4" rx="2" fill="#FFB81F"/>
  <!-- racha -->
  <text x="140" y="126" font-family="DM Sans, Arial, sans-serif" font-size="8" font-weight="800" fill="#14161F">Tu racha semanal</text>
  <g>
    <circle cx="146" cy="142" r="6" fill="#D9341A"/><circle cx="160" cy="142" r="6" fill="#D9341A"/><circle cx="174" cy="142" r="6" fill="#D9341A"/>
    <circle cx="188" cy="142" r="6" fill="#D9341A"/><circle cx="202" cy="142" r="6" fill="#E4E0D8"/><circle cx="216" cy="142" r="6" fill="#E4E0D8"/>
  </g>
  <text x="140" y="166" font-family="DM Sans, Arial, sans-serif" font-size="7.5" font-weight="800" fill="#14161F">Hoy: Fuerza 20 min</text>
  <rect x="138" y="174" width="84" height="22" rx="8" fill="#F6F3EE"/>
  <rect x="146" y="182" width="48" height="6" rx="3" fill="#E4E0D8"/>
  <!-- pulso -->
  <path d="M22 118h28l9-26 14 52 11-40 9 14h14" fill="none" stroke="#FFB81F" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="24" y="170" font-family="DM Sans, Arial, sans-serif" font-size="10" font-weight="700" fill="#14161F">Contenido que</text>
  <text x="24" y="184" font-family="DM Sans, Arial, sans-serif" font-size="10" font-weight="700" fill="#1F7A5C">vale la pena</text>
  <!-- falla técnica -->
  <rect x="252" y="96" width="88" height="68" rx="12" fill="#fff" stroke="#D9341A" stroke-width="2"/>
  <path d="M296 108l17 30h-34z" fill="#D9341A"/><rect x="294.5" y="118" width="3" height="10" rx="1.5" fill="#fff"/><circle cx="296" cy="132.5" r="1.8" fill="#fff"/>
  <text x="296" y="152" text-anchor="middle" font-family="DM Sans, Arial, sans-serif" font-size="8.5" font-weight="800" fill="#14161F">La app se cerró</text>
  <text x="296" y="161" text-anchor="middle" font-family="DM Sans, Arial, sans-serif" font-size="7.5" font-weight="600" fill="#D9341A">Android</text>
</svg>
